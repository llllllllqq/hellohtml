name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    name: Package and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package source
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="hellohtml-${TAG}/" -o "hellohtml-${TAG}.zip" HEAD
          ls -lh "hellohtml-${TAG}.zip"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="hellohtml-${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，只更新附件（通常说明是手动发布的 release）"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
