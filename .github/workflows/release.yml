name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    name: Package HTML and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check all page versions are identical and match the tag
        run: |
          # 九个页面共用一个版本号；标签必须等于这个统一版本号。
          # 校验逻辑与 tests/structure.spec.js 用的是同一个脚本。
          node scripts/versions.js check "${GITHUB_REF_NAME}"

      - name: Package HTML only
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="hellohtml-${TAG}-html.zip"
          git archive --format=zip --prefix="hellohtml-${TAG}/" -o "$ZIP" HEAD -- '*.html'

          EXPECTED="$(git ls-files '*.html' | wc -l)"
          ACTUAL="$(python3 -c "import sys, zipfile; print(sum(1 for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.endswith('.html')))" "$ZIP")"
          echo "压缩包内 HTML：$ACTUAL / 仓库内 $EXPECTED"
          if [ "$EXPECTED" -ne "$ACTUAL" ]; then
            echo "::error::压缩包里的 HTML 数量与仓库不一致"
            exit 1
          fi
          python3 -c "import sys, zipfile; [print(' ', n) for n in zipfile.ZipFile(sys.argv[1]).namelist()]" "$ZIP"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="hellohtml-${TAG}-html.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，只更新附件（通常说明是手动发布的 release）"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "hellohtml ${TAG}" \
              --generate-notes \
              --verify-tag
          fi
