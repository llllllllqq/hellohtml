<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>读色挑战 · 白底版</title>
<style>
:root{ --fg:#111111; --sc:#111111; --sw:0em; }
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  height:100vh; height:100dvh;
  overflow:hidden;
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overscroll-behavior:none;
}

/* 中央大字：--fg 字芯色，--sc 描边色，--sw 描边宽度（0 即不描边） */
#word{
  font-size:clamp(4rem,32vmin,20rem);
  font-weight:900; line-height:1.05; letter-spacing:.04em;
  color:var(--fg); white-space:nowrap;
  -webkit-text-stroke:var(--sw) var(--sc);
  paint-order:stroke fill;                 /* 描边画在字形外侧，不啃掉笔画 */
  transition:color .18s ease;
}
#word.pop{animation:pop .38s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{
  0%{transform:scale(.68); opacity:0}
  60%{transform:scale(1.05); opacity:1}
  100%{transform:scale(1); opacity:1}
}

/* 极老浏览器兜底：不支持 -webkit-text-stroke 时用八向阴影模拟描边 */
@supports not (-webkit-text-stroke: 1px #000){
  #word{
    text-shadow:
      var(--sw) 0 0 var(--sc), calc(-1 * var(--sw)) 0 0 var(--sc),
      0 var(--sw) 0 var(--sc), 0 calc(-1 * var(--sw)) 0 var(--sc),
      calc(var(--sw) * .7) calc(var(--sw) * .7) 0 var(--sc),
      calc(-1 * var(--sw) * .7) calc(var(--sw) * .7) 0 var(--sc),
      calc(var(--sw) * .7) calc(-1 * var(--sw) * .7) 0 var(--sc),
      calc(-1 * var(--sw) * .7) calc(-1 * var(--sw) * .7) 0 var(--sc);
  }
}

/* 开场：先熟悉 7 种颜色 */
#intro{
  position:fixed; inset:0; z-index:20;
  background:#fff; color:#111;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(12px,3vh,22px);
  padding:24px 18px calc(24px + env(safe-area-inset-bottom));
  overflow-y:auto; overscroll-behavior:contain;
  transition:opacity .4s ease;
}
#intro.hide{opacity:0; pointer-events:none}
#intro h1{
  font-size:clamp(1.05rem,5.2vw,1.5rem); font-weight:800; letter-spacing:.06em;
}
#intro h1 em{font-style:normal; opacity:.45; font-weight:600}

#swatches{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
  gap:clamp(6px,1.4vh,12px) 18px;
  width:100%; max-width:560px;
}
.swatch{display:flex; align-items:center; gap:11px}
.chip{
  width:clamp(26px,7.5vw,34px); height:clamp(26px,7.5vw,34px);
  border-radius:9px; flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.13);
}
.sw-label{
  font-size:clamp(15px,4.4vw,20px); font-weight:800; letter-spacing:.04em;
  -webkit-text-stroke:var(--sw, 0em) var(--sc, #111111);
  paint-order:stroke fill;
}

.rule{
  font-size:clamp(12px,3.4vw,15px); line-height:1.8; opacity:.62; text-align:center;
}
.rule b{font-weight:800; opacity:1}
.start{
  font-size:clamp(13px,3.6vw,16px); font-weight:700;
  padding:11px 24px; border-radius:999px; color:#fff; background:#111;
  animation:breathe 1.8s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>

<div id="word"></div>

<div id="intro">
  <h1>先认一下这 7 种颜色 <em>· 记住它们的名字</em></h1>
  <div id="swatches"></div>
  <p class="rule">开始后：说出<b>字的颜色</b>，不是字的意思，或反过来<br>点击屏幕任意位置，换下一题</p>
  <div class="start">点击任意位置开始</div>
</div>

<script>
(function(){
  'use strict';

  /* 七色：高辨识度色相，规则很简单——
     深色（红绿蓝黑）在白底上本身够清楚，不加描边；
     浅色（黄粉白）字芯提亮后靠一圈同色系/深色描边勾出字形。
     ink = 字芯  stroke = 描边  sw = 描边宽度（大字用） */
  var COLORS = [
    { name:'红色', ink:'#DE2910' },                                        /* 国旗红 */
    { name:'黄色', ink:'#F0DC00', stroke:'#7A6600', sw:'.022em' },         /* 柠檬黄 + 深黄描边 */
    { name:'绿色', ink:'#16A34A' },
    { name:'蓝色', ink:'#2563EB' },
    { name:'粉色', ink:'#FF9EC7', stroke:'#C2185B', sw:'.022em' },         /* 亮粉 + 深玫红描边 */
    { name:'黑色', ink:'#111111' },
    { name:'白色', ink:'#FFFFFF', stroke:'#111111', sw:'.035em' }          /* 白 + 黑描边 */
  ];
  var N = COLORS.length;

  var el = {
    body: document.body,
    word: document.getElementById('word'),
    intro: document.getElementById('intro'),
    swatches: document.getElementById('swatches')
  };

  var started = false, prevColor = -1, prevWord = -1, locked = false;

  /* 随机取一个不在排除列表里的下标 */
  function pickExcluding(ex){
    var pool = [], i;
    for(i=0;i<N;i++){ if(ex.indexOf(i) === -1) pool.push(i); }
    if(!pool.length) return Math.floor(Math.random()*N);
    return pool[Math.floor(Math.random()*pool.length)];
  }

  /* 色卡列表：由 COLORS 生成，保证和游戏里的显示效果一致 */
  (function buildSwatches(){
    var frag = document.createDocumentFragment(), i, c, row, chip, label;
    for(i=0;i<N;i++){
      c = COLORS[i];
      row = document.createElement('div');
      row.className = 'swatch';

      chip = document.createElement('span');
      chip.className = 'chip';
      chip.style.background = c.ink;
      /* 有描边的颜色，色块也带上同色边框，和游戏里的观感保持一致 */
      if(c.stroke) chip.style.boxShadow = 'inset 0 0 0 2px ' + c.stroke;

      label = document.createElement('b');
      label.className = 'sw-label';
      label.textContent = c.name;
      label.style.color = c.ink;
      if(c.stroke){
        label.style.setProperty('--sc', c.stroke);
        label.style.setProperty('--sw', '.07em');   /* 小字用更粗的比例 */
      }

      row.appendChild(chip);
      row.appendChild(label);
      frag.appendChild(row);
    }
    el.swatches.appendChild(frag);
  })();

  /* 出一题：字的颜色和字的意思都随机 */
  function nextRound(){
    var colorIdx = pickExcluding([prevColor]);   // 颜色不和上一题重复
    var wordIdx  = pickExcluding([prevWord]);    // 字义不和上一题重复
    prevColor = colorIdx; prevWord = wordIdx;

    var c = COLORS[colorIdx];
    el.body.style.setProperty('--fg', c.ink);
    el.body.style.setProperty('--sc', c.stroke || '#111111');
    el.body.style.setProperty('--sw', c.sw || '0em');
    el.word.textContent = COLORS[wordIdx].name;

    el.word.classList.remove('pop');
    void el.word.offsetWidth;                    // 重启动画
    el.word.classList.add('pop');
  }

  function tap(){
    if(locked) return;
    locked = true;
    setTimeout(function(){ locked = false; }, 120);   // 防手抖连触

    if(!started){
      started = true;
      el.intro.classList.add('hide');
      setTimeout(function(){ el.intro.style.display = 'none'; }, 420);
    }
    nextRound();
  }

  document.addEventListener('pointerdown', tap, {passive:true});
  document.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); tap(); }
  });
  if(!window.PointerEvent){                          // 老浏览器兜底
    document.addEventListener('touchstart', tap, {passive:true});
  }
})();
</script>
</body>
</html>
